name: broker-deploy

# Optional alternative to Cloudflare Workers Builds. Never runs on push or PR.
# Existing Worker secrets must already be configured; this job does not copy,
# rotate or synchronize them. Do not run two production deployment paths at once.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and bundle only, upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gha-mcp-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'fmdntracker/gha-mcp-host' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: broker
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npx --yes npm@11.19.1 install --no-audit --no-fund --package-lock=false
      - name: typecheck
        run: npm run typecheck
      - name: dry run
        if: inputs.dry_run
        run: npx wrangler deploy --dry-run --outdir dist
      - name: deploy existing Worker
        if: '!inputs.dry_run'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
