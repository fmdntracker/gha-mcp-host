name: broker-deploy

# Optional manual fallback. The normal deploy path is Cloudflare Workers Builds.
# This workflow never copies or overwrites Worker or runner application secrets.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and bundle only; do not deploy"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gha-mcp-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.dry_run || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npx --yes --package=npm@11.19.1 -- npm install --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: bundle without deploying
        run: npx wrangler deploy --dry-run
      - name: deploy existing Worker
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Configure the optional manual-deploy secret first}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the Cloudflare account ID first}"
          npx wrangler deploy
