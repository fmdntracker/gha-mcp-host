name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "broker/src/**"
      - "broker/selfhost/**"
      - "broker/third_party/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose*.yaml"
      - "deploy/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    paths:
      - "broker/src/**"
      - "broker/selfhost/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose*.yaml"
      - "deploy/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and test Node broker (no Cloudflare or real workflow dispatch)
        working-directory: broker/selfhost
        run: |
          npm install --no-audit --no-fund
          node -e "console.log('LOCK_GZIP_BASE64='+require('node:zlib').gzipSync(require('node:fs').readFileSync('package-lock.json')).toString('base64'))"
          npm run build
          npm test
      - name: Validate Compose variants
        env:
          MCP_AUTH_TOKEN: ci-token
          BROKER_SECRET: ci-secret
          GITHUB_PAT_DISPATCH: ci-pat
          PUBLIC_URL: https://mcp.example.com
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml -f compose.https.yaml config --quiet
      - name: Build and smoke-test the production container
        env:
          MCP_AUTH_TOKEN: ci-token
          BROKER_SECRET: ci-secret
          GITHUB_PAT_DISPATCH: ci-pat
          PUBLIC_URL: http://localhost:8787
        run: |
          set -euo pipefail
          dc() { docker compose -f compose.yaml -f compose.build.yaml "$@"; }
          trap 'dc logs --no-color; dc down --volumes' EXIT
          dc up -d --build --wait --wait-timeout 120
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/healthz)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/mcp)" = 401
          # Exercise an actual MCP exchange inside the non-root/read-only image.
          curl --fail-with-body --max-time 15 http://127.0.0.1:8787/mcp \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'env_create'
          dc restart broker
          dc up -d --no-build --wait --wait-timeout 60
      - name: Dependency lock candidate
        if: always()
        # Kept as a reviewable build artifact, never a secret or server state.
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-dependency-lock
          path: broker/selfhost/package-lock.json
          retention-days: 7

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'fmdntracker/gha-mcp-host' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted GHA MCP broker with local SQLite
      - name: Build and push amd64 + arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
