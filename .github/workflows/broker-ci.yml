name: broker-ci

on:
  push:
    branches: [main]
    paths: ['broker/**', '.github/workflows/broker-ci.yml']
  pull_request:
    paths: ['broker/**', '.github/workflows/broker-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: broker
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Preserve the source repository's dependency policy (no committed lock).
      - name: install
        run: npx --yes --package=npm@11.19.1 -- npm install --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      # The migrated broker has no Vitest cases yet. This is not an e2e test.
      - name: unit tests if present
        run: npx vitest run --passWithNoTests
      - name: bundle without deploying
        run: npx wrangler deploy --dry-run
      - name: no cutSafe
        run: |
          if grep -rn 'cutSafe' src test 2>/dev/null; then
            echo "::error::no such export; bytes.ts exports safeCut"
            exit 1
          fi
      - name: one cut site only
        run: |
          callers="$(grep -rl 'renderWindow(' src | grep -v '^src/bytes.ts$' | sort | tr '\n' ' ')"
          echo "callers: ${callers:-none}"
          test "$(echo $callers)" = "src/tools-shared.ts"
      - name: window contract
        run: |
          if grep -n 'next_byte\|partial_line_dropped' src/env-window.ts; then
            echo "::error::WindowResult must not carry next_byte or partial_line_dropped"
            exit 1
          fi
      - name: dropped by decision
        run: |
          if grep -rn 'DEFAULT_DENY_PATTERNS\|checkCommand\|deny_pattern' src; then
            echo "::error::the deny layer was removed by decision"
            exit 1
          fi
          if grep -rniE 'opencode[-_]mcp[-_]bridge' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github --exclude-dir=.wrangler; then
            echo "::error::that project is not a permitted source here; see VENDOR.md"
            exit 1
          fi
